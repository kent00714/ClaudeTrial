name: Ticket release monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs are often delayed several minutes
  workflow_dispatch:
  # Scheduled runs only fire from the default branch; a push here lets the
  # monitor run (and be verified against the real sites) before merging.
  push:
    branches: [claude/ticket-release-monitor]
    paths: ["ticket-monitor/**", ".github/workflows/ticket-monitor.yml"]

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ticket-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ticket-monitor/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Discover events on each site
        run: python -m ticket_monitor --discover-only -v

      # State (last-seen availability) is carried between runs through the cache.
      - uses: actions/cache/restore@v4
        with:
          path: ticket-monitor/state
          key: ticket-state-${{ github.run_id }}
          restore-keys: ticket-state-

      - name: Check once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m ticket_monitor --once

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ticket-monitor/state
          key: ticket-state-${{ github.run_id }}
